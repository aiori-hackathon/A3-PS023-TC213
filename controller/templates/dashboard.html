<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloud Hypervisor Orchestrator | Cluster Operations Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-canvas: #090d16;
      --bg-panel: #0f172a;
      --bg-surface: #1e293b;
      --bg-input: #0b1120;
      --border-subtle: #334155;
      --border-strong: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --status-online: #10b981;
      --status-bg: #064e3b;
      --status-border: #059669;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 24px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-main);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .token-input {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      width: 220px;
      border-radius: 2px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }
    .panel {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .panel-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .panel-body {
      padding: 14px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-family: var(--font-mono);
    }
    .form-control {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 2px;
    }
    .form-control:focus {
      outline: 1px solid var(--accent-blue);
      border-color: var(--accent-blue);
    }
    .btn {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: 1px solid #1d4ed8;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-align: center;
      border-radius: 2px;
      font-family: var(--font-mono);
    }
    .btn:hover {
      background-color: var(--accent-hover);
    }
    .btn-action {
      padding: 3px 8px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      border-radius: 2px;
      border: 1px solid transparent;
      background: var(--bg-surface);
      color: var(--text-main);
      margin-right: 4px;
    }
    .btn-action:hover {
      border-color: var(--border-strong);
    }
    .btn-action-start {
      color: #34d399;
      border-color: #059669;
      background: #064e3b;
    }
    .btn-action-stop {
      color: #fbbf24;
      border-color: #b45309;
      background: #451a03;
    }
    .btn-action-delete {
      color: #f87171;
      border-color: #be123c;
      background: #4c0519;
    }
    .node-card {
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 2px;
    }
    .node-card:last-child {
      margin-bottom: 0;
    }
    .node-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .node-id-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      font-family: var(--font-mono);
      border-radius: 2px;
    }
    .badge-online { background-color: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge-offline { background-color: #4c0519; color: #f87171; border: 1px solid #be123c; }
    .badge-running { background-color: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge-stopped { background-color: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    .meter-container {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      height: 10px;
      width: 100%;
      margin: 8px 0;
      border-radius: 2px;
      overflow: hidden;
    }
    .meter-bar {
      background-color: var(--accent-blue);
      height: 100%;
      transition: width 0.3s ease;
    }
    .node-stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    th {
      background-color: var(--bg-surface);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    td {
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .log-line {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <h1 class="header-title">Cloud Hypervisor Orchestrator // Cluster Control Console</h1>
    <div class="header-controls">
      <label for="admin-token" style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">API Token:</label>
      <input type="password" id="admin-token" class="token-input" placeholder="Bearer Token" value="default-admin-token">
    </div>
  </header>

  <main class="main-grid">
    <!-- Left Column: Cluster Topology & Placement Form -->
    <div>
      <section class="panel">
        <header class="panel-header">Worker Node Registry</header>
        <div class="panel-body" id="node-container">
          <p class="log-line">Polling active nodes...</p>
        </div>
      </section>

      <section class="panel">
        <header class="panel-header">Provision MicroVM Instance</header>
        <div class="panel-body">
          <form id="provision-form" onsubmit="handleProvision(event)">
            <div class="form-group">
              <label for="vm-name">Workload Name</label>
              <input type="text" id="vm-name" class="form-control" value="guest-prod-01" required>
            </div>
            <div class="form-group">
              <label for="vm-vcpus">vCPUs (1-4)</label>
              <input type="number" id="vm-vcpus" class="form-control" value="2" min="1" max="4" required>
            </div>
            <div class="form-group">
              <label for="vm-ram">Allocated RAM (MB)</label>
              <input type="number" id="vm-ram" class="form-control" value="1024" min="128" max="2048" step="128" required>
            </div>
            <button type="submit" class="btn" id="btn-submit">Dispatch Provision Request</button>
          </form>
          <div id="action-status" class="log-line"></div>
        </div>
      </section>
    </div>

    <!-- Right Column: Instances & Telemetry -->
    <div>
      <section class="panel">
        <header class="panel-header">
          <span>Active MicroVM Instances</span>
          <span id="vm-counter">0 tracked</span>
        </header>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Instance</th>
                <th>Placement</th>
                <th>Network (IP / MAC)</th>
                <th>vCPUs</th>
                <th>RAM</th>
                <th>State</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="vm-table-body">
              <tr>
                <td colspan="7" style="color: var(--text-muted); text-align: center; padding: 24px;">
                  No microVMs registered in cluster state.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    function getAuthHeaders() {
      const token = document.getElementById('admin-token').value.trim();
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    async function fetchClusterData() {
      try {
        const headers = getAuthHeaders();
        const [nodesRes, vmsRes] = await Promise.all([
          fetch('/api/v1/nodes', { headers }),
          fetch('/api/v1/vms', { headers })
        ]);

        let nodes = [];
        let vms = [];

        if (nodesRes.ok) nodes = await nodesRes.json();
        if (vmsRes.ok) vms = await vmsRes.json();

        renderNodes(nodes);
        renderVMs(vms);
      } catch (err) {
        console.error('Telemetry polling error:', err);
      }
    }

    function renderNodes(nodes) {
      const container = document.getElementById('node-container');
      if (!nodes || nodes.length === 0) {
        container.innerHTML = '<p class="log-line">No worker nodes currently registered.</p>';
        return;
      }

      nodes.sort((a, b) => a.node_id.localeCompare(b.node_id));

      container.innerHTML = nodes.map(n => {
        const total = n.total_ram_mb || 4096;
        const free = n.free_ram_mb !== undefined ? n.free_ram_mb : total;
        const used = Math.max(0, total - free);
        const pctUsed = Math.min(100, Math.round((used / total) * 100));

        const isOnline = n.health_status === 'ONLINE';
        const badgeClass = isOnline ? 'badge-online' : 'badge-offline';

        return `
          <div class="node-card">
            <div class="node-row-top">
              <span class="node-id-label">${n.node_id} (${n.host}:${n.port})</span>
              <span class="badge ${badgeClass}">${n.health_status}</span>
            </div>
            <div class="meter-container">
              <div class="meter-bar" style="width: ${pctUsed}%;"></div>
            </div>
            <div class="node-stat-row">
              <span>RAM: ${used} / ${total} MB (${pctUsed}%)</span>
              <span>Headroom: ${free} MB</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderVMs(vms) {
      const tbody = document.getElementById('vm-table-body');
      const counter = document.getElementById('vm-counter');
      counter.textContent = `${vms.length} tracked`;

      if (!vms || vms.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="color: var(--text-muted); text-align: center; padding: 24px;">
              No microVM instances currently provisioned.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = vms.map(vm => {
        const isRunning = vm.status === 'RUNNING';
        const isStopped = vm.status === 'STOPPED';
        const badgeClass = isRunning ? 'badge-running' : 'badge-stopped';

        const startBtn = isStopped 
          ? `<button class="btn-action btn-action-start" onclick="vmAction('${vm.vm_id}', 'start')">Start</button>` 
          : '';
        const stopBtn = isRunning 
          ? `<button class="btn-action btn-action-stop" onclick="vmAction('${vm.vm_id}', 'stop')">Stop</button>` 
          : '';
        const delBtn = `<button class="btn-action btn-action-delete" onclick="vmAction('${vm.vm_id}', 'delete')">Delete</button>`;

        const networkMeta = vm.ip 
          ? `<div>${vm.ip}</div><div style="font-size: 10px; color: var(--text-dim);">${vm.mac || 'N/A'}</div>`
          : '<span style="color: var(--text-dim);">Unassigned</span>';

        return `
          <tr>
            <td><strong>${vm.vm_id}</strong><div style="color: var(--text-dim); font-size: 11px;">${vm.name}</div></td>
            <td>${vm.node_id || 'unassigned'}</td>
            <td>${networkMeta}</td>
            <td>${vm.vcpus}</td>
            <td>${vm.memory_mb} MB</td>
            <td><span class="badge ${badgeClass}">${vm.status}</span></td>
            <td>${startBtn}${stopBtn}${delBtn}</td>
          </tr>
        `;
      }).join('');
    }

    async function handleProvision(e) {
      e.preventDefault();
      const statusDiv = document.getElementById('action-status');
      const submitBtn = document.getElementById('btn-submit');

      const payload = {
        name: document.getElementById('vm-name').value,
        vcpus: parseInt(document.getElementById('vm-vcpus').value, 10),
        memory_mb: parseInt(document.getElementById('vm-ram').value, 10)
      };

      submitBtn.disabled = true;
      statusDiv.textContent = 'Submitting placement request to scheduler...';

      try {
        const res = await fetch('/api/v1/vms', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify(payload)
        });

        if (res.status === 201) {
          const data = await res.json();
          statusDiv.textContent = `Allocated ${data.vm_id} onto ${data.node_id}.`;
          fetchClusterData();
        } else {
          const err = await res.json();
          statusDiv.textContent = `Placement failed: ${err.detail || res.statusText}`;
        }
      } catch (err) {
        statusDiv.textContent = `Dispatch error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function vmAction(vmId, action) {
      if (action === 'delete' && !confirm(`Terminate and delete microVM instance ${vmId}?`)) return;

      const method = action === 'delete' ? 'DELETE' : 'POST';
      const path = action === 'delete' ? `/api/v1/vms/${vmId}` : `/api/v1/vms/${vmId}/${action}`;

      try {
        const res = await fetch(path, { method, headers: getAuthHeaders() });
        if (res.ok) {
          fetchClusterData();
        } else {
          const err = await res.json();
          alert(`Operation failed: ${err.detail || res.statusText}`);
        }
      } catch (err) {
        alert(`Action communication error: ${err.message}`);
      }
    }

    fetchClusterData();
    setInterval(fetchClusterData, 3000);
  </script>
</body>
</html>
